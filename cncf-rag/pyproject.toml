[project]
name = "cncf-rag"
version = "0.1.0"
description = "Enterprise-grade RAG pipeline over CNCF ecosystem documentation"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1.0",
    "mistune>=3.0.2",
    "marko>=2.1.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "cohere>=5.5.0",
    "openai>=1.30.0",
    "qdrant-client>=1.18.0,<1.19.0",
    "tiktoken>=0.7.0",
    "spacy>=3.7.0",
    "boto3>=1.34.0",
    "aioboto3>=12.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "ragas>=0.1.9",
    "datasets>=2.19.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.43",
    "anthropic>=0.28.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
