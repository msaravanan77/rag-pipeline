# Embedding provider configuration.
# OpenAI text-embedding-3-small chosen for ingestion speed: paid tier allows
# 1M tokens/min vs Cohere trial's 100k/min, cutting full ingestion from ~40 min
# to ~6 min. Cohere reranking is unchanged — see retrieval.yaml.
provider: openai
model: text-embedding-3-small
dimensions: 1536            # text-embedding-3-small native dimensionality
batch_size: 512             # well under OpenAI's 2048-text limit; big enough to amortise overhead
max_input_tokens: 8191      # text-embedding-3-small context window
